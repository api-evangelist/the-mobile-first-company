entities:
- name: ConversationItem
  description: A unified call or SMS record; the core object of the conversations surface.
  subtypes: [call, sms]
  operations: [listConversations, searchAllConversations, getConversationItem, batchGetConversationItems, updateCallSummary, executeConversationAction]
- name: Contact
  description: A person Allo has communicated with, keyed by phone number; conversations are grouped by contact.
  operations: [searchContacts, createContact, updateContact, getContactContext, getContactConversation]
- name: Tag
  description: A label applied to conversation items for filtering.
  operations: [listTags, addTags, removeTag]
- name: PhoneNumber
  description: An Allo phone number or sender ID with capabilities.
  operations: [getNumbers, listNumbers, setNumberDefaultSummaryTemplate]
- name: User
  description: A team member with a role and assignments.
  operations: [getMe, listUsers, getUser]
- name: SummaryTemplate
  description: A template controlling how AI call summaries are structured for the team.
  operations: [listSummaryTemplates, createSummaryTemplate, getSummaryTemplate, updateSummaryTemplate, deleteSummaryTemplate]
- name: Webhook
  description: A subscriber endpoint bound to one or more event topics, with a signing secret.
  operations: [listWebhooks, createWebhook, getWebhook, updateWebhook, deleteWebhook, listWebhookEventTypes]
- name: DialingQueue
  description: A Power Dialer queue of phone numbers assigned to a user.
  operations: [getCurrentDialingQueue, resetCurrentDialingQueue, upsertCurrentDialingQueue, appendDialingQueueNumbers, clearDialingQueueNumbers]
- name: Person
  description: A CRM person record.
  operations: [createPerson, getPerson, updatePerson, searchPeople]
- name: Company
  description: A CRM company record.
  operations: [createCompany, getCompany, updateCompany, searchCompanies]
- name: Deal
  description: A CRM deal, synced from CRM integrations.
  operations: [createDeal, getDeal, updateDeal, deleteDeal, searchDeals]
- name: PartnerAccount
  description: A reseller-provisioned Allo account (one seat on the partner subscription) with a scoped API key.
  operations: [createPartnerAccount, getPartnerAccount, deletePartnerAccount]
